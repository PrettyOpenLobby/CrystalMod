name: build
on: [push, pull_request]
jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python check.py --selftest
      - run: python check.py
  shim:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: build PolHook.dll and PolShimSetup.exe (MSVC x86)
        shell: cmd
        run: build.bat
      - uses: actions/upload-artifact@v4
        with:
          name: polshim
          path: |
            build/PolHook.dll
            build/PolShimSetup.exe
