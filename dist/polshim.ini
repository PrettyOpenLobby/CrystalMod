; PoL-Shim config -- Steam Deck / distribution defaults.
; Lives next to PolHook.dll. Diagnostics OFF; functional/QoL fixes ON.
; The trace keys are driven by [polshim] trace (0 = off, the compiled default
; since 0.2.0). They are still listed individually below, at 0, because each
; one OVERRIDES the level -- so this file says what it means either way.
[polshim]
log=polshim.log
; MASTER BYPASS: 1 = the shim stands down completely -- no hooks, no probes,
; no patches, no redirect, no autoupdate; the COM proxy forwards the GENUINE
; object UNWRAPPED. Pulling the injector does NOT do this (the self-loading
; proxy in the install tree loads anyway), which is why the switch exists.
; The settings watcher survives (a polling thread, no hooks) so the dialog can
; turn it back off; that is the only exception, and the log says so.
; It announces itself with two "*** BYPASS" lines in the log -- if they are not
; there, it is NOT on and the run proves nothing.
bypass=0


; HOW FAR THIS INSTALL HAS BEEN REPAIRED. The shim replaces a setting still sitting
; at a default we have since superseded -- once per step, then it stamps this and
; never touches that key again (src/iniheal.cpp, inimigrate). A file shipped with the
; current values is stamped here so it is not re-walked; an OLD install has no stamp,
; reads as 0, and gets every repair. Setting it back to 0 re-runs them all.
config_rev=1
; Each injected process writes log.<pid>.log, and one launch produces several, so they
; pile up. Keep the newest N and delete the rest at startup (0 = never delete).
log_keep=12

; --- diagnostics: OFF (perf) ---
; How much the shim logs: 0 off, 1 what each layer did, 2 + per-message spies,
; 3 + memory-image dumps. Every individual trace key below overrides it.
trace=0

; --- functional / compat: ON ---
comtrace=1            ; installs the hook contentiid_alias + the FE patch-reverify ride
contentiid_alias=1    ; FMO / Fantasy Earth "Class not registered" fix
patches=1             ; *** required for Fantasy Earth to launch *** (needs comtrace=1)
patches_optional=0
filecheck_fl=0        ; Friend List: clear app.dll's reject flag for content 14.
;                       0 SINCE 2026-08-27 -- shipped 1 for one build alongside a
;                       Fantasy Earth freeze/crash on launch. Pairs with [regfix]
;                       filetxt; turn ON one at a time, with someone watching.
mail_store_fix=1

; version tag appended to the window title -- your "am I on the latest build?" check
titletag=1

modules=polcore.dll,app.dll,PolContents.dll
max_slots=128

; DirectX / cursor / audio QoL. Master switches + fixes on.
;
; NO per-layer trace rows here (hook_trace, trace, d3d_trace, d3d_msgspy,
; d3d_dumpcaller, d3d_renderspy, dinput_trace, ...): [polshim] trace is the ONE
; level, and an explicit per-layer row OVERRIDES it -- so a template row of 0
; would permanently defeat "set trace=3" on every install healed from this file
; (measured on the Steam Deck, 2026-08-19). Write a per-layer row only to pin
; one layer against the level, in your own ini, on purpose.
[dx]
hook_enable=1
enable=1
sound_globalfocus=1
sound_coop=1
d3d_enable=1
; The GAME window is subclassed either way (d3d_msgspy is trace only) -- that
; subclass carries the move/resize/minimise behaviour, and gating it once made
; the window completely immovable. See install_msgspy() in src/d3d8hook.cpp.
d3d_clientrect=0
; d3d_fitwindow is RETIRED as of 0.2.0 and a row here does nothing. Sizing the
; client to the backbuffer and giving the window a frame are both part of
; d3d_windowed now -- 0 left every game an unmovable borderless box.
; Keep the picture's shape: window drags, maximise, AND the remembered size.
d3d_aspect=1
; Put a title's DirectShow movie window on the game, at the movie's own aspect
; (letterboxed, never stretched). d3d_videoclass is the escape hatch if a
; renderer here uses a class neither of these names -- the log's window census
; says which.
d3d_fitvideo=0
d3d_videoclass=VideoRenderer,FilterGraphWindow
; 2 = ALIGN the mask to the game's client rect and park it behind. Mode 1 only
; HIDES it, which leaves polcore's CreateInput mapping against the old rect --
; this shipped as 1 by mistake, disagreeing with both the compiled default and
; the tuned config we actually run.
d3d_unmask=2
; Keep pol.exe's PlayOnlineMask* window ALIVE. polcore's SetMaskWindowHandle and
; CreateInput are bound to that HWND and the class wndproc is a bare DefWindowProcA
; thunk, so a close request from a window manager destroys it -- and the Viewer then
; errors out and exits. Reported on a Steam Deck under gamescope, 2026-08-15
; (Fantasy Earth, Front Mission Online). Unlike d3d_unmask above, this arms at
; PROCESS START, so it also covers a title that dies before graphics init.
;   0 off   1 protect (refuse close requests, log the lifecycle)
;   2 protect + shrink it to 1x1 off-screen so a one-window compositor
;     (gamescope) can never pick it. Costs the black transition cover.
; TRY 2 ON THE DECK if a title still dies at launch with mask_guard=1.
mask_guard=1
d3d_cursor=2
d3d_freecursor=1
d3d_nosteal=1
; A forced-windowed title re-takes the MOUSE CAPTURE the instant it loses it
; (FMO does this from WM_CAPTURECHANGED). A captured window gets no non-client
; hit-testing, so its caption stops dragging after the first move. 0 = SE's
; behaviour.
d3d_nograb=1

; --- SLEEP AND WAKE (src/wakerecover.cpp) ---------------------------------
; D3D8/9 lose the device when the machine suspends and the APPLICATION is
; required to rebuild it. These titles do not, so they present into a dead
; device for ever -- the black window after a Steam Deck sleep. The shim
; supplies the missing half, and stands down the moment a title turns out to
; handle its own device loss. See polshim.ini in the source tree for the long
; version, and the [wake] lines in the log for what a resume actually did.
wake_enable=1
wake_reset=1
wake_nudge=1
wake_grace_ms=3000
wake_gap_ms=15000
wake_max_resets=8
; DEBUG LEVER, not a fix: calls a non-thread-safe device off the render thread.
wake_offthread=0
; WINDOWED MODE -- ON BY DEFAULT SINCE 2026-08-24.
;
; It shipped as 0 for most of this project's life, on the reasoning that a
; behaviour change should be opt-in. What overturned that is not a preference:
; an exclusive fullscreen device OWNS the display, so alt-tab, the settings
; chord (a no-op while one is live), any overlay, and recovery from sleep are
; all things it takes away -- the game becomes very hard to LEAVE.
;
; Set 0 to go back to whatever mode each title asks for. To put back just ONE
; title, use d3d_windowed_except below instead -- that is almost always what you
; want, and it is what the two titles with a fullscreen history are for.
d3d_windowed=1

; PER-TITLE opt-out for the override above. Comma-separated module leaf names;
; a title listed here keeps the exclusive fullscreen device it asked for.
;
; SHIPS EMPTY FROM 2026-08-24. It carried FFXiMain.dll while d3d_windowed was an
; opt-in checkbox, because ticking that checkbox black-screened FFXI on a Steam
; Deck (2026-08-15). Windowed is the DEFAULT now, so this list stopped being a
; guard on a choice somebody made and became a title pinned in the exclusive
; mode that is the actual complaint -- a game you cannot get out of.
;
; This is the ONE WAY BACK, per title, without giving up windowed mode for
; everything else. It is a visible dropdown in the settings dialog now
; ("Titles left fullscreen"), not a hidden string. Put a title here if it is
; genuinely worse in a window:
;   d3d_windowed_except=FFXiMain.dll          ; FFXI black-screened windowed, once
;   d3d_windowed_except=FrontMissionOnline.dll ; if its opening movie flickers
;
; One d3d8.dll vtable serves TM.dll, FFXiMain.dll and FE_Client.dll, so the hook
; cannot tell them apart by vtable -- but CreateDevice's RETURN ADDRESS lands
; inside the calling title, which names it exactly. Applied to Reset() as well,
; or the first Reset would drag an excepted title back into windowed mode.
; A skipped override is LOGGED, so "did not fire" stays distinguishable from
; "fired and did not help".
d3d_windowed_except=

; CLEAR a title's compiled compat PROFILE, so d3d_windowed decides for it after
; all. Comma-separated module leaf names.
;
; RETIRED IN PRACTICE 2026-08-24, and a NO-OP on a stock build. src/profiles.cpp
; used to hard-code PW_FULLSCREEN for FMO and FFXI, and that verdict outranked
; d3d_windowed -- so "Run games in a window" silently did nothing for those two,
; and this key was the only way to clear it. Both rows are PW_DEFAULT now, so
; there is no fullscreen verdict left to clear and this key has nothing to do.
;
; Kept, not deleted: the mechanism is correct and a future title may need
; PW_FULLSCREEN. The setting you probably want is the OPPOSITE one,
; d3d_windowed_except above -- that is the live control now.
;
; Never overrode the add-on stand-down (FFXI under Ashita/Windower) -- that is a
; correctness guard, tested first, and not clearable from here.
d3d_windowed_force=
; If a title's OWN fullscreen device fails (modern panels often list no 800x600
; mode at all), retry it windowed instead of letting the title die on the
; failure -- FMO answers one with a deliberate crash ("dx" + ExitProcess 3).
; Fires only AFTER the verbatim fullscreen call has failed, so a machine that
; can serve fullscreen never sees it.
d3d_fs_rescue=1
d3d_bbsize=
; Tell a TITLE that the screen is its own backbuffer (GetDisplayMode and
; GetSystemMetrics). Only the title module is answered this way -- the Viewer
; shell always gets the real desktop size. That gate is not optional: pol.exe
; builds MINMAXINFO.ptMaxTrackSize out of SM_CXSCREEN/SM_CYSCREEN, so answering
; 640x480 to the shell told Windows the Viewer's own window may never exceed
; 640x480. Symptom, on build 31 and earlier: switching d3d_windowed on visibly
; SHRANK the Viewer window and it could not be dragged back out.
d3d_fakemode=1
dinput_enable=1
; Wrap GAME CONTROLLER devices as well as the mouse. This is what carries the button
; mapping in [inputmode] and what lets the mapping window show the live pad. Independent
; of dinput_enable so turning the MOUSE fixes off does not also blind the controller UI.
dinput_pad=1
dinput_nonexclusive=1
; 2 = SET Tetra Master's cursor variable outright instead of steering it with
; deltas: its cursor is two int16s at a fixed RVA that the game clamps itself,
; so the pointer lands exactly where you point at any window size. Falls back to
; 1's behaviour on any title where the address does not resolve.
dinput_mouseabs=2
dinput_cursor_xy=TM.dll+0x2FF59C
dinput_abs_home=6    ; mode 1 only -- mode 2 needs no homing
dinput_abs_clip=0
dinput_abs_yield=1   ; mode 2: let the pad and the game's own menus move the cursor too
                     ;   (off = the shim writes the pointer's position every poll, which
                     ;    erases pad navigation and any screen that holds a selection)
dinput_abs_follow=1  ; while the game owns the cursor, park the OS pointer on it, so the
                     ;   next mouse movement continues from there instead of jumping
dinput_abs_wake=3    ; device counts of real motion that take the cursor back off the pad
dinput_abs_keepdelta=0 ; leave the mouse deltas live (pre-subtracting the game's own add)
                     ;   so screens that read MOTION still see it -- see polshim.ini

; PROTON / STEAM DECK: which Direct3D 8 driver you get, and it is the single biggest
; framerate setting on a Deck. Every POL title but Front Mission Online is d3d8, and
; stock Proton runs d3d8 through wined3d (OpenGL) unless PROTON_DXVK_D3D8=1 -- even
; though the DXVK d3d8 build ships inside that same Proton. Measured on a Deck
; 2026-09-07 in Tetra Master: 61% -> 24% of one core, and the room screen went from
; "lags hard" to "WAY better".
;
; The key lives in the PROTON folder, not the prefix, so CHANGING PROTON VERSION
; SILENTLY REVERTS IT. That is not a worry, it is history -- it happened 2026-08-27
; and cost eleven days before anyone noticed. Hence the shim repairing it itself.
[proton]
; Write PROTON_DXVK_D3D8=1 into the ACTIVE Proton's user_settings.py.
; NOTE: this writes OUTSIDE the game folder, into a Steam runtime directory, and applies
; to EVERY game under that Proton -- the widest write this shim makes. 0 turns it off.
; NOTE: it takes effect on the NEXT launch: Proton chooses the d3d8.dll before this DLL
; exists, so a repair cannot help the run that made it. The log says so.
; Your own file is kept: existing settings are preserved, the original is copied to
; user_settings.py.bak-polshim, and a file we do not recognise is left alone.
dxvk_d3d8=1
; Log which d3d8 driver is actually loaded (DXVK or wined3d). Read-only, one line.
; Leave it on: nothing in the client said this before, which is exactly why the
; regression above survived eleven days.
report=1

; CONTROLLER: forced on for the Steam Deck (its prefs app is never surfaced, so the
; pad does nothing otherwise). Set mode=off for keyboard/mouse.
[inputmode]
mode=force_gamepad

; BUTTON MAPPING -- MAP IT IN THE UI, DO NOT EDIT THIS BY HAND.
; Open the settings dialog (ctrl+shift+s on a keyboard, back+start on the pad) and press
; "Controller mapping...". You bind by PRESSING the button you want, it takes effect on
; the running client immediately, and the window shows you live where each press lands.
;
; pad_remap=1 permutes the pad's buttons inside the DirectInput device the client reads,
; so it needs nothing in the registry. That is what makes it work on a Steam Deck at all:
; a fresh Proton prefix has no Settings\Controller key, and every registry-based override
; below is silently inert without one.
;
; pad_bind names the PHYSICAL button each action sits on -- `ok=0,cancel=1,menu=3,navi=2`.
; On an Xbox-layout pad (what a Deck presents) that index space is 0=A 1=B 2=X 3=Y.
pad_remap=0
pad_bind=
; Which hardware's button NAMES the mapper prints. Display only -- it never changes a
; binding. `deck` is the user's own measurement (A=0 B=2 View=6 Menu=7); an index nobody
; has measured prints as "button N" instead of being guessed.
pad_names=deck

; The OLDER, launch-time route: rewrite POL's own action->button INDICES in flight, under
;   HKLM\SOFTWARE\PlayOnlineUS\SquareEnix\PlayOnlineViewer\Settings\Controller
;   HKLM\SOFTWARE\PlayOnline\Square\PlayOnlineViewer\Settings\Controler   (JP, one `l`)
; Still honoured, and pad_remap composes with them -- but they apply only at the next
; launch and do nothing when that key is absent. POL ships PS2 face order (Menu=0 Ok=1
; Cancel=2 Navi=3), which on an Xbox-layout pad puts confirm on B and cancel on X;
; pad_layout=xbox rewrites all four, swap_confirm only exchanges two of them (and so
; moves confirm to X rather than fixing it). btn_* beats pad_layout. The mapper's
; "Details..." shows the live state of all of this.
pad_layout=off

; fmv_skip=4 refuses the DirectShow filter graph a title builds for its opening movie,
; so it takes its no-movie path. Fantasy Earth and Front Mission Online die under Wine
; decoding theirs. Level 2 (skip RenderFile) is a PLACEBO for both -- neither ever calls
; RenderFile; FMO builds its graph with AddFilter. 0 plays the movie normally.
fmv_skip=4

; force_pad=1 serves each title's OWN "use the gamepad" registry gate as ON, in process
; (registry untouched). This is not a mapping option -- it is what makes a pad EXIST for a
; title. Tetra Master's gate `PAD` is 0 on a fresh Proton prefix, and with it 0 TM skips the
; entire joystick path (TM.dll RVA 0x186071) -- no device, nothing for pad_remap to permute.
; Only Tetra Master has a measured gate; force_pad_trace=1 logs reads to find the others.
force_pad=1

; seed_pad=1 supplies a measured, working pad map for any value a title asks for that the
; registry does NOT have -- absent only, so anything you have configured always wins. A
; fresh Proton prefix gets controls that work without opening a config app. Covers Tetra
; Master, Front Mission Online, FFXI and the Viewer shell; Fantasy Earth keeps its pad
; config outside the registry, so it is not covered.
seed_pad=1
swap_confirm=0
swap_key=Controller,Controler
btn_ok=-1
btn_cancel=-1
btn_navi=-1
btn_menu=-1

; REGISTRATION REPAIR: register titles whose files are present but whose registry
; entries are missing (copied here without a real install), so they show in the games
; menu and launch. Writes only MISSING keys (never overwrites); clean=1 undoes them.
; root = optional extra folder to search for title directories.
; Dev machines only: pin the Viewer's patch version check so the auto-update never
; overwrites your local polhook.dll build. Leave 0 on normal installs.
; --- SESSION / SLEEP AND WAKE, THE NETWORK HALF (src/sessionwatch.cpp) ------
;
; [dx] wake_* above rebuilds the Direct3D DEVICE after a suspend. The auth-band
; sockets do not survive one either, and until 2026-09-06 nothing did anything
; about that: the Viewer came back believing in a session that was gone and
; raised POL-0006 on its next dial -- "the TCP port is duplicated", a bind
; collision in the client's own stack -- recoverable
; only by fully exiting. Measured live: ~45 min idle, the server logged no close
; at all, and a clean login the instant the Viewer was restarted.
;
; On a detected resume the shim now calls shutdown() on the tracked auth-band
; sockets. Not closesocket: that frees the port but invalidates a handle the
; client still owns, and Winsock recycles handle values. shutdown keeps the
; handle valid and turns a SILENTLY dead socket into a DEMONSTRABLY dead one, so
; the client's next recv returns 0 and its own teardown runs -- the path it
; already has, which closes the socket properly and releases the port.
;
; The sockets are already dead when this fires, so 1 is the honest default.
; Set 0 to go back to the old behaviour (and a full exit after every sleep).
[session]
wake_netdrop=1

[patch]
noupdate=0

[regfix]
enable=1
filetxt=0             ; write <installdir>\file.txt when a title has none -- the
                      ; Friend List's patch tree serves no manifest, and both Check
                      ; Files and regfix read a title without one as not installed.
                      ; 0 SINCE 2026-08-27 (see [polshim] filecheck_fl). Only the
                      ; settings dialog's Repair button writes one; it hashes the
                      ; whole title, so it is never done at startup.
; root=
; clean=0
;
; Interface\NNNN is the install-time stamp that DECRYPTS a title's patch.ver. Without
; it the client reports the title "not installed" or "version unknown" however correct
; InstallFolder is -- and regfix cannot invent one. It is recoverable from the title's
; own patch.ver. Supply it per title:
;   interface_0001=02613000    FINAL FANTASY XI
;   interface_0002=026130e3    Tetra Master
;   interface_0011=070c1a5e    Fantasy Earth
;   interface_0014=070a00fd    Friend List
; Front Mission Online (0004) has NO Interface at all, which is exactly why it is the
; one title the easy tier alone can launch.
;
; These stamps are per-INSTALL: correct for titles copied from the machine they were
; recovered on, wrong otherwise. The "Repair game registration..." report now names
; which keys each title is missing, so it will tell you if these did not take.

; IN-GAME SETTINGS DIALOG: press the chord to edit these options without leaving the
; game / editing this file. Changes apply the next time the Viewer starts.
;   hotkey     a COMMA-SEPARATED LIST; any chord opens the dialog. Each entry is
;              ctrl/shift/alt + a letter, digit, F-key, home/end/insert/pause/tab/
;              space/enter/esc. An unparsable entry is dropped, the rest still arm.
;   pad_chord  back(=select) start lb rb l3 r3 up down left right a b x y
;
; ON A STEAM DECK, `back` IS THE VIEW BUTTON -- the small button to the LEFT of the
; screen -- and `start` is Menu, the small one to the RIGHT. `back` is NOT the B face
; button. So the default chord is View + Menu, not B + Start.
;
; If the chord does nothing, look in polshim.log:
;   - lines like `pad0 buttons=0x2010 start+b`  -> XInput works, wrong buttons; put the
;     names it prints straight into pad_chord=
;   - `NO controller on slots 0-3`              -> Steam Input is giving this game a
;     keyboard/mouse layout, not an emulated pad; fix that in the controller settings
;   - `no XInput available`                     -> the prefix has no xinput dll
;   - `[settings] opened` but nothing on screen -> the DirectDraw shell is covering the
;     dialog; check d3d_windowed=1 above (it is the default since 2026-08-24)
;   - `chord IGNORED -- a title is holding the display EXCLUSIVELY` -> working as
;     intended: see fullscreen_ok below
;
; fullscreen_ok=0 (default) makes the chord a NO-OP while a title holds an exclusive
; fullscreen Direct3D device. Measured on a Steam Deck, 2026-08-15: opening the dialog
; inside FFXI CRASHED the game -- the new window takes the display from the device.
;
; Since 2026-08-24 d3d_windowed defaults to 1, so on a stock install no title should
; be holding an exclusive device and the chord should work everywhere. This guard is
; still here for a title deliberately put back with d3d_windowed_except, and for FFXI
; running under Ashita/Windower (its device is left alone either way). If the chord
; reports `chord IGNORED`, that is what is happening -- it is working as intended.
; Set fullscreen_ok=1 only if you know the title you are in survives it.
[settings]
enable=1
hotkey=home,ctrl+shift+s
pad_chord=back+start
fullscreen_ok=0

; SERVER: leave enable=0 here. Point at your server at LAUNCH instead, via the
; Steam Launch Options (no file edit):   POLSHIM_SERVER=<ip> %command%
; (or --polserver=<ip>). Precedence: --polserver > POLSHIM_SERVER > server= below.
[redirect]
enable=0
strict=1
server=

; SAVED SERVERS: name=address, one per line. They appear in the settings dialog's
; server dropdown, so switching dev <-> prod is a pick instead of retyping an IP on a
; touchscreen keyboard. "Save server as..." adds the address currently in the box;
; "Forget server" removes it. [redirect] server= still holds the ACTIVE one.
[servers]

; -----------------------------------------------------------------------------
; FINAL FANTASY XI ADD-ONS -- Ashita and Windower.
;
; You do NOT install an add-on here. Both of them inject themselves into pol.exe,
; which is the same process this shim is already inside (PolHook.dll is a proxy
; pol.exe statically imports), so you point Ashita's or Windower's own launcher at
; THIS install's pol.exe and both are loaded. This key only decides what the SHIM
; does about it.
;
; addons  auto = stand down only when an add-on core is actually in the process
;                (detected by module identity, logged when it happens)
;         on   = always stand down, core or not
;         off  = never; the shim keeps its own FFXI device handling and probes
;
; Standing down means two things, and only these two: FFXI's Direct3D device is
; passed through untouched (no windowed override, no window fitting, no mask
; realign -- the add-on does its own), and the FFXiMain probes are not armed (they
; patch bytes at fixed RVAs, which sits underneath an add-on's signature scans).
[ffxi]
addons=auto
